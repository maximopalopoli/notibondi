<div class="arrivals"
     hx-get="/partials/stops/{{ stop_id }}/arrivals"
     hx-trigger="every 30s"
     hx-swap="outerHTML">
  <ul>
    {% for a in arrivals %}
    <li>
      <strong>{{ a.line }}</strong> {{ a.headsign }}
      <span class="tag tag-{{ a.source }}">{% if a.source == "realtime" %}en vivo{% else %}programado{% endif %}</span>
      <span class="minutes">{% if a.minutes == 0 %}llegando{% else %}{{ a.minutes }} min{% endif %}</span>
    </li>
    {% else %}
    <li>No hay colectivos en los próximos 90 minutos.</li>
    {% endfor %}
  </ul>
</div>
