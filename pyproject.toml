[project]
name = "notibondi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maximopalopoli", email = "mpalopoli@fi.uba.ar" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "gtfs-realtime-bindings>=3.0.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
