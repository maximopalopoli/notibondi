[project]
name = "notibondi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maximopalopoli", email = "mpalopoli@fi.uba.ar" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings==2.16.1",
    "sqlalchemy>=2.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
notibondi = "notibondi:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
